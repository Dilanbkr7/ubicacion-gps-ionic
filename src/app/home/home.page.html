<ion-header>
  <ion-toolbar>
    <ion-title>Mi Ubicación GPS (Standalone)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding location-content">

  <ion-card class="coordinates-card">
    <ion-card-header>
      <ion-card-title>Coordenadas actuales</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>
        <strong>Latitud:</strong>
        {{ latitude() !== null ? latitude() : 'No disponible' }}
      </p>

      <p>
        <strong>Longitud:</strong>
        {{ longitude() !== null ? longitude() : 'No disponible' }}
      </p>
    </ion-card-content>
  </ion-card>

  <ion-text
    class="status-message"
    [color]="error() ? 'danger' : 'dark'">
    <p>{{ error() || status() }}</p>
  </ion-text>

  <ion-button
    expand="block"
    class="get-button"
    (click)="getLocation()">
    OBTENER UBICACIÓN ACTUAL
  </ion-button>

  <ion-button
    expand="block"
    class="start-button"
    [disabled]="tracking()"
    (click)="startTracking()">
    INICIAR SEGUIMIENTO
  </ion-button>

  <ion-button
    expand="block"
    class="stop-button"
    [disabled]="!tracking()"
    (click)="stopTracking()">
    DETENER SEGUIMIENTO
  </ion-button>

</ion-content>
